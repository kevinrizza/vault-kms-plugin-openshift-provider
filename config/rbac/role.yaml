---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - kms.openshift.io
  resources:
  - vaultkmsconfigs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - kms.openshift.io
  resources:
  - vaultkmsconfigs/finalizers
  verbs:
  - update
- apiGroups:
  - kms.openshift.io
  resources:
  - vaultkmsconfigs/status
  verbs:
  - get
  - patch
  - update

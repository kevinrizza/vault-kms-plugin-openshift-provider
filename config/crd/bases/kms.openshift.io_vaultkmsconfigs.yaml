                  rule: self.matches('^[a-zA-Z0-9._~-]+(/[a-zA-Z0-9._~-]+)*/keys/[a-zA-Z0-9_]([a-zA-Z0-9_.-]*[a-zA-Z0-9_])?$')
              vaultNamespace:
                description: |-
                  vaultNamespace specifies the Vault namespace where the Transit secrets engine is mounted.
